<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C8DC"/>
      <stop offset="0.5" stop-color="#D4A5B8"/>
      <stop offset="1" stop-color="#A78BCA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- 玻璃高光层 -->
  <rect width="512" height="512" rx="112" fill="url(#shine)" style="mix-blend-mode:overlay;opacity:0.6;"/>
  <!-- 内部柔光 -->
  <ellipse cx="180" cy="140" rx="160" ry="120" fill="rgba(255,255,255,0.12)" filter="blur(40px)"/>
  <!-- 图标文字 -->
  <text x="256" y="268" font-size="260" text-anchor="middle" dominant-baseline="central">◈</text>
</svg>
