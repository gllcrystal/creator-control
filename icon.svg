<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C8DC"/>
      <stop offset="0.5" stop-color="#D4A5B8"/>
      <stop offset="1" stop-color="#A78BCA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="1" stop-color="rgba(201,184,216,0.35)"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角渐变背景 -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- 内部柔光 -->
  <ellipse cx="180" cy="140" rx="160" ry="120" fill="rgba(255,255,255,0.12)" filter="blur(40px)"/>

  <!-- 灵动的星环（倾斜轨道 + 星星点缀） -->
  <g transform="translate(256 256)">
    <ellipse cx="0" cy="0" rx="168" ry="78" fill="none" stroke="url(#ring)" stroke-width="6"
             opacity="0.7" transform="rotate(-28)"/>
    <!-- 轨道上的三颗星 -->
    <g fill="#FFFFFF" filter="url(#glow)">
      <circle cx="150" cy="-58" r="6" transform="rotate(-28)"/>
      <circle cx="-120" cy="62" r="4.5" transform="rotate(-28)" opacity="0.85"/>
      <circle cx="40" cy="86" r="3.5" transform="rotate(-28)" opacity="0.7"/>
    </g>
    <!-- 四角闪光星 -->
    <path d="M168 -40 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 z" fill="#FFFFFF" opacity="0.9" transform="rotate(-28)" filter="url(#glow)"/>
  </g>

  <!-- 中心菱形 -->
  <text x="256" y="272" font-size="240" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" opacity="0.95">◈</text>

  <!-- 玻璃高光层 -->
  <rect width="512" height="512" rx="112" fill="url(#shine)" style="mix-blend-mode:overlay;opacity:0.6;"/>
</svg>
